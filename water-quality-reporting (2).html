.btn.alt{background:var(--ac2);color:var(--ac)}

.msg{color:var(--er);font-weight:700;margin:8px 0 0}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.82rem;font-weight:700;border:1.5px solid currentColor}

.id{font-weight:700;color:var(--ac)}

.tl li::before{content:"";position:absolute;left:-30px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--bd)}
.tl li.on{color:var(--tx)}
.tl li.on::before{background:var(--ac);border-color:var(--ac)}
.tl li.on:last-child::before,.tl li.fin::before{background:var(--ok);border-color:var(--ok)}
.tl b{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}

.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}

.bar{display:grid;grid-template-columns:130px 1fr 28px;gap:8px;align-items:center;margin:6px 0;font-size:.92rem}

.sw{display:flex;gap:8px;align-items:center;font-weight:700;margin:0 0 4px}
.sw input{width:20px;height:20px}
.fine{color:var(--mu);font-size:.85rem;margin-top:20px}
